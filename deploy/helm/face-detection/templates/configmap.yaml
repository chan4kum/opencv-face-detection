apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fd.fullname" . }}
  labels: {{- include "fd.labels" . | nindent 4 }}
data:
  FD_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  FD_SCORE_THRESHOLD: {{ .Values.config.scoreThreshold | quote }}
  FD_NMS_THRESHOLD: {{ .Values.config.nmsThreshold | quote }}
  FD_MAX_FACES: {{ .Values.config.maxFaces | quote }}
  FD_INFERENCE_MAX_SIDE: {{ .Values.config.inferenceMaxSide | quote }}
  FD_MAX_UPLOAD_BYTES: {{ .Values.config.maxUploadBytes | int64 | quote }}
  FD_MAX_IMAGE_PIXELS: {{ .Values.config.maxImagePixels | int64 | quote }}
  FD_MAX_CONCURRENT_INFERENCE: {{ .Values.config.maxConcurrentInference | quote }}
  FD_INFERENCE_QUEUE_TIMEOUT_S: {{ .Values.config.inferenceQueueTimeoutS | quote }}
  FD_DOCS_ENABLED: {{ .Values.config.docsEnabled | quote }}
  FD_CORS_ALLOW_ORIGINS: {{ .Values.config.corsAllowOrigins | quote }}
  FD_JOB_TTL_S: {{ .Values.config.jobTtlS | quote }}
  FD_JOB_MAX_DELIVER: {{ .Values.config.jobMaxDeliver | quote }}
  FD_WORKER_CONCURRENCY: {{ .Values.config.workerConcurrency | quote }}
  FD_DELETE_INPUT_AFTER_PROCESSING: {{ .Values.config.deleteInputAfterProcessing | quote }}
  FD_NATS_PROVISION: "true"
