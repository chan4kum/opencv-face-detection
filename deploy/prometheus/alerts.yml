# Prometheus alerting rules. The same expressions are reused by the Helm chart's PrometheusRule.
groups:
  - name: face-detection
    rules:
      - alert: FaceDetectionHighErrorRate
        expr: |
          sum(rate(fd_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(fd_http_requests_total[5m])), 1e-9) > 0.02
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "More than 2% of requests are failing with 5xx"
          runbook_url: "https://github.com/chan4kum/opencv-face-detection/blob/main/docs/RUNBOOK.md#high-error-rate"
      - alert: FaceDetectionHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(fd_http_request_duration_seconds_bucket{route="/v1/detect"}[5m]))) > 0.5
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "p95 latency of /v1/detect is above 500 ms"
          runbook_url: "https://github.com/chan4kum/opencv-face-detection/blob/main/docs/RUNBOOK.md#high-latency"
      - alert: FaceDetectionLoadShedding
        expr: sum(rate(fd_inference_rejected_total[5m])) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "Requests are being shed (503) because inference capacity is exhausted; scale out"
          runbook_url: "https://github.com/chan4kum/opencv-face-detection/blob/main/docs/RUNBOOK.md#load-shedding"
      - alert: FaceDetectionJobsFailing
        expr: |
          sum(rate(fd_jobs_processed_total{outcome=~"failed_exhausted|poison"}[10m])) > 0
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "Async jobs are failing after exhausting retries (infrastructure fault, not bad input)"
          runbook_url: "https://github.com/chan4kum/opencv-face-detection/blob/main/docs/RUNBOOK.md#jobs-failing"
      - alert: FaceDetectionQueueBacklog
        expr: max(nats_consumer_num_pending{consumer_name="fd-workers"}) > 500
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "More than 500 jobs have been waiting for 10 minutes; workers are not keeping up"
          runbook_url: "https://github.com/chan4kum/opencv-face-detection/blob/main/docs/RUNBOOK.md#queue-backlog"
      - alert: FaceDetectionInstanceDown
        expr: up{job=~"face-detection-.*"} == 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "A face-detection instance is not being scraped"
